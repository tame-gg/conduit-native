# Conduit configuration.
#
# The live lines are the ones most networks change. Everything else is commented
# out at its default: uncomment a line to change it, leave it alone to keep the
# default. A commented-out line says which of two things it is:
#   (default: X)  what Conduit uses while the line stays commented out
#   (example)     a value with no default; nothing happens until you write one
#
# Settings marked "restart" are read once at start. Everything else is re-read by
# /conduit reload. Paths are relative to this file. The README explains every
# setting in full.


# ============================================================================
#  NETWORK  --  the port players reach, the backends behind it, where they land
# ============================================================================

[listener]
# 127.0.0.1 accepts only this machine. Use 0.0.0.0 to accept from the network.
# (restart)
host = "127.0.0.1"
port = 25565
# Largest packet Conduit reads before dropping the connection. (default: 1048576)
# max-frame-bytes = 1048576
# Packets this size or larger are compressed on the way to players; -1 turns it off.
# (restart) (default: 256)
# compression-threshold = 256
# Read a HAProxy PROXY protocol header, so TCPShield, HAProxy or a load balancer in
# front can say which player a connection belongs to. The header is NOT
# authenticated: only turn this on when the port is firewalled to that service.
# (restart) (default: false)
# proxy-protocol = false

# One block per backend. The name is what /server takes and what /glist shows.
# Use host + port, or address = "host:port".
[servers.lobby]
host = "127.0.0.1"
port = 25566

# A second backend, with a player cap. max-players is how many the proxy sends
# there before it is full, whatever the backend itself allows; 0, the default, is
# no limit. A full server is skipped on join and refused by /server. (example)
# [servers.survival]
# host = "127.0.0.1"
# port = 25567
# max-players = 40

[routing]
# Tried in order when a player joins.
initial = ["lobby"]
# Tried in order when the server a player is on goes away under them.
fallback = ["lobby"]
# A player a backend kicks is moved to the next server that takes them, rather than
# disconnected from the network. (default: true)
# fallback-on-kick = true

# One proxy, several front doors: the address a player typed in their server list
# sends them to a particular backend. Port and case are ignored. One server, or a
# list tried in order.
# A host nothing here matches follows routing.initial as usual.
# [forced-hosts]
# "lobby.example.com" = "lobby"
# "pvp.example.com" = ["pvp", "lobby"]


# ============================================================================
#  IDENTITY AND TRUST  --  who the player is, and how a backend knows
# ============================================================================

# Who checks that a player is who they say they are. The backends cannot: they
# run online-mode=false behind the proxy.
#   "online"   Conduit does the Mojang handshake itself. What a public server wants.
#   "offline"  the name the client sent is taken at face value. Local tests only.
[authentication]
mode = "online"
# Where the Mojang session check goes. (default: the Mojang session server)
# session-url = "https://sessionserver.mojang.com/session/minecraft/hasJoined"
# How long that check may take, in milliseconds. (default: 5000)
# timeout-millis = 5000
# Let a new login end the session of a player already connected under that name.
# (default: false)
# kick-existing-players = false

# How a backend learns the identity Conduit established, and that it came from
# Conduit.
#   "none"    nothing is forwarded. Fine for a local test, and only that.
#   "modern"  the Velocity-style signed handshake. Give every backend the same
#             secret (Paper: velocity.secret in config/paper-global.yml). Use this
#             one in public.
#   "legacy" / "bungeeguard"  only for backends that speak nothing else
#             (Spigot bungeecord: true). Legacy is unsigned: firewall the backends.
#             BungeeGuard sends the secret below as its token.
# The secret is generated on first start whatever the mode, so turning this to
# "modern" later is this one line plus a copy into each backend.
[forwarding]
mode = "none"
# (default: "forwarding.secret")
# secret-file = "forwarding.secret"
# Forwarded in place of the player's own address, where backends must not see
# client IPs. (example)
# player-address = "127.0.0.1"


# ============================================================================
#  WHAT PLAYERS SEE  --  the server list entry, and closing the doors
# ============================================================================

# motd takes MiniMessage (<red>, <bold>, <gradient:#5e4fa2:#f79459>) or &-codes,
# with \n for a second line.
[status]
motd = "Conduit"
# Only the number shown after the slash; it limits nothing. (default: 100)
# display-max-players = 100
# A 64x64 PNG, relative to this file. (example)
# favicon = "server-icon.png"
# "plugins" lets a ping plugin set the icon, "proxy-only" always sends the one above.
# favicon-policy = "plugins"
# How many names the server list shows when the player count is hovered; 0 hides them.
# player-sample = 12
# Follow each name with the server they are on, as "Steve (lobby)".
# player-sample-server = false
# Mark the network safe for the No Chat Reports mod. A promise about the backends.
# prevents-chat-reports = false

# What one hostname shows instead, so a forced host is a branded entry of its own.
# [status.host."pvp.example.com"]
# motd = "<red>PvP</red> — the arena"
# favicon = "pvp-icon.png"

# Turned on and off with /conduit maintenance: players see motd in the server list
# and kick-message if they try to join. allowlist names who may still join.
# [maintenance]
# enabled = true
# active-on-start = false
# kick-message = "This network is currently under maintenance. Please try again later."
# motd = "Conduit — under maintenance"
# allowlist = []

# What a banned player is shown. {reason}, {actor}, {duration}, {remaining} and
# {expiry} are filled in; \n is a line break; &-codes and MiniMessage work.
# [bans]
# message = "&cYou have been banned from this network.\n\n&7Reason: &f{reason}\n&7Banned By: &f{actor}\n&7Duration: &f{duration}"
# default-reason = "No reason given"
# permanent-duration = "Permanent"
# temporary = "Expires in {remaining}"
# permanent = "This ban is permanent."

# Who may run Conduit's admin commands in-game while no permissions plugin is
# installed: names or UUIDs. For groups, put a permissions.toml beside this file
# instead (README, "Permission nodes"). (example)
# [permissions]
# operators = ["YourName"]


# ============================================================================
#  EVERYTHING ELSE  --  rarely changed; shown at the defaults Conduit uses
# ============================================================================

# ViaVersion translation. It is what gives a cross-version player sounds,
# particles, scoreboards, titles and boss bars; Conduit's own translators drop
# those. "via-preferred" still falls back to them where Via has no path. Set
# enabled = false for native-only translation and accept the drops.
# See docs/VIAVERSION.md and docs/LICENSING_VIA.md (GPLv3 Via* artifacts).
# [translation]
# enabled = true
# engine = "via-preferred"
# via-backwards = true
# via-rewind = true
# via-legacy = false
# data-folder = "via"

# Turn clients away by Minecraft version: a list of versions or protocol numbers,
# a range, or both. {versions} in the messages is filled in from the rules.
# [versions]
# enabled = false
# allow = ["1.20.4", "1.21.5"]
# minimum = "1.20.4"
# maximum = "1.21.8"
# ping-version-name = "Conduit {versions}"
# kick-message = "This network only allows Minecraft {versions}."
# kick-message-range = "This network only allows Minecraft versions {versions}."
# Refuse a player whose version is not the backend's exactly, rather than translate.
# strict-backend-match = false

# Conduit pings each backend on a timer so routing can skip a dead one.
# [health]
# enabled = true
# interval-ms = 10000
# timeout-ms = 1500
# failure-threshold = 3
# success-threshold = 2

# Ctrl+C, a service stop and /conduit shutdown: players are told, plugins are
# disabled, then the process exits within timeout-ms.
# [shutdown]
# graceful-enabled = true
# timeout-ms = 5000
# message = "Conduit is shutting down."

# Per-source connection limits, grouped by address prefix.
# [security.throttle]
# enabled = true
# max-attempts = 40
# window-ms = 1000
# max-concurrent = 32
# ipv4-prefix = 32
# ipv6-prefix = 64
# log-interval-ms = 5000

# Connections that open and do nothing earn strikes; strike-threshold of them inside
# strike-window-ms blocks the source for block-duration-ms.
# [security.bot-filter]
# enabled = true
# strike-threshold = 10
# handshake-timeout-ms = 3000
# block-duration-ms = 60000
# strike-window-ms = 60000

# What to do about plugin-message channels a client opens; default-action covers
# anything not listed.
# [security.channel-guard]
# enabled = false
# default-action = "log"
# block-list = ["wdl:init", "wdl:control"]
# log-list = ["schematica"]
# kick-list = []

# The tighter limits used while /conduit attack is on. auto-trip-per-second switches
# it on by itself when more connections than that arrive in one second (0 = never),
# and off after a quiet minute. known-sources-only lets only addresses a player has
# logged in from since start log in while it is on; pings are still answered.
# [security.attack-mode]
# throttle-max-attempts = 8
# bot-strike-threshold = 3
# auto-trip-per-second = 0
# known-sources-only = false

# Forge, NeoForge and Fabric handshakes. unknown-policy "allow" lets a handshake
# Conduit does not recognise through; anything else refuses it.
# [modded]
# enabled = true
# known-packs-limit = 1024
# handshake-cache = true
# handshake-cache-capacity = 4096
# handshake-cache-ttl-ms = 300000
# forge-compat = true
# neoforge-compat = true
# fabric-compat = true
# unknown-policy = "allow"
# packet-queue-enabled = true
# packet-queue-max-depth = 512
# log-mod-handshakes = false

# The BungeeCord plugin channel, which a hub plugin's /hub is built on.
# trusted-servers is which backends may move, kick or message players on other
# servers; empty trusts every server.
# [messaging]
# bungeecord-channel = true
# trusted-servers = []

# One webhook told when a backend goes down or recovers, attack mode changes, and
# the proxy comes up. Discord and Slack URLs work as they are. (example)
# [alerts]
# webhook-url = "https://discord.com/api/webhooks/..."

# Prometheus metrics at GET /metrics. No authentication: keep it on loopback or a
# private network. (restart) (example)
# [metrics]
# prometheus-address = "127.0.0.1:9225"

# The GameSpy 4 query some server lists and status bots read, over UDP: the MOTD,
# player count and names. port = 0 is the listener's own port. (restart)
# [query]
# enabled = false
# port = 0

# ViaVersion is not inside the Conduit jar: the first start installs the set this
# build pins into lib/via, checksummed, and via = true also takes newer releases
# in the same line on start. Nothing here can stop Conduit starting. conduit = true
# only logs a line when a newer Conduit release is on GitHub. (restart)
# [updates]
# via = true
# check-only = false
# timeout-ms = 5000
# via-check-interval-hours = 12
# conduit = true


# Written by Conduit, so a newer version knows which settings this file predates.
# Leave it alone.
[ops]
schema-version = 6
