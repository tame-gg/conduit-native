# The ViaVersion artifacts merged into conduit.jar.
#
# The bootstrap reads this to decide whether a set of jars in lib/via is newer than
# what it already carries. Without it every start would have to assume the jars on
# disk are better, and a stale lib/via would quietly downgrade Via.
#
# These must match scripts/fetch-via.ps1, which downloads the jars that get merged,
# and scripts/fetch-via-source.ps1, which downloads their Corresponding Source.
# BundledViaVersionsTest fails if this file and fetch-via.ps1 disagree.
viaversion-api=5.11.0
viaversion-common=5.11.0
viabackwards-common=5.11.0
viarewind-common=4.1.3
ViaLegacy=3.0.16
