# The ViaVersion version line this build is pinned to.
#
# Via is not inside conduit.jar. A first start with nothing in lib/via installs the
# newest release of this line from repo.viaversion.com, and the updater keeps it
# there. The major numbers are what matters: gg.tame.conduit.viaversion extends Via's
# internal classes, so a set from another major is refused rather than used.
#
# These must match scripts/fetch-via.ps1, which puts the same jars in lib/via for a
# development build. ViaOverrideTests fails if this file and that script disagree.
viaversion-api=5.11.0
viaversion-common=5.11.0
viabackwards-common=5.11.0
viarewind-common=4.1.3
ViaLegacy=3.0.16
