# The ViaVersion version line this build is pinned to.
#
# Via is not inside conduit.jar. A first start with nothing in lib/via installs
# exactly these versions from repo.viaversion.com, checked against the hashes below,
# and the updater then keeps the line current. The major numbers are what matters: gg.tame.conduit.viaversion extends Via's
# internal classes, so a set from another major is refused rather than used.
#
# These must match scripts/fetch-via.ps1, which puts the same jars in lib/via for a
# development build. ViaOverrideTests fails if this file and that script disagree.
viaversion-api=5.12.0
viaversion-common=5.12.0
viabackwards-common=5.12.0
viarewind-common=4.2.0
ViaLegacy=3.1.0
# SHA-256 of each pinned jar. A first install downloads exactly these versions and refuses a jar
# that does not match: the hash is in this build, not on the server the jar came from.
sha256.viaversion-api=b46c01cc123d55f79789e2f4eaf89827e636e3b398c84a7af6c2b51b810c6920
sha256.viaversion-common=183e0ba9e5c8a19ac192b884e4a7d9402af5f321738e4f18010ba139214f76cc
sha256.viabackwards-common=232651d294c8608d579886e1d95e9ab8b42a0b2dcaec28818b5218fd1ddb2385
sha256.viarewind-common=572e0f57bea56a52269c6d39cfb60e3648f9cc95fbb7ae29242264dd9b2ae68d
sha256.ViaLegacy=92ae9376c93aee611c891ba576576a0f501dd8d9c94b3b08f2a2e16a2d9c8e27
