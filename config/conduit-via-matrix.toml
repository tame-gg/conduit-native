# Every representative backend at once, on one proxy.
#
# The compatibility work needs two things a per-pair config cannot give: any client
# version reaching any backend version, and /server between backends that are whole
# eras apart. One listener with every backend registered gives both, and it also
# means a switch test and a join test exercise the same configuration rather than
# two that drifted.
[listener]
host = "127.0.0.1"
port = 25580
max-frame-bytes = 1048576

[forwarding]
mode = "none"

[authentication]
mode = "offline"

# real Minecraft 1.7.6-1.7.10 (protocol 5)
[servers.v176]
host = "127.0.0.1"
port = 25607

# real Minecraft 1.8.9 (protocol 47)
[servers.v189]
host = "127.0.0.1"
port = 25608

# real Minecraft 1.12.2 (protocol 340)
[servers.v1122]
host = "127.0.0.1"
port = 25612

# real Minecraft 1.13 (protocol 393)
[servers.v113]
host = "127.0.0.1"
port = 25613

# real Minecraft 1.13.2 (protocol 404)
[servers.v1132]
host = "127.0.0.1"
port = 25614

# real Minecraft 1.15.2 (protocol 578)
[servers.v1152]
host = "127.0.0.1"
port = 25615

# real Minecraft 1.16.5 (protocol 754)
[servers.v1165]
host = "127.0.0.1"
port = 25616

# real Minecraft 1.20.4 (protocol 765)
[servers.v1204]
host = "127.0.0.1"
port = 25604

# real Minecraft 1.21.8 (protocol 772)
[servers.v1218]
host = "127.0.0.1"
port = 25621

# real Minecraft 26.2 (protocol 776)
[servers.v262]
host = "127.0.0.1"
port = 25626

[routing]
# A modern backend to land on, so "old client on a new server" is the default shape
# and every other pairing is one /server away.
initial = ["v1204"]
fallback = ["v1204", "v113"]


# Conduit Ops defaults (schema 3)
[maintenance]
enabled = true
active-on-start = false
kick-message = "This network is currently under maintenance. Please try again later."
motd = "Conduit — under maintenance"
allowlist = []

# Conduit Ops defaults (schema 3)
[health]
enabled = true
interval-ms = 10000
timeout-ms = 1500
failure-threshold = 3
success-threshold = 2

# Conduit Ops defaults (schema 3)
[versions]
enabled = false
allow = []
ping-version-name = "Conduit {versions}"
kick-message = "This network only allows Minecraft {versions}."
kick-message-range = "This network only allows Minecraft versions {versions}."

# Conduit Ops defaults (schema 3)
[shutdown]
graceful-enabled = true
timeout-ms = 5000
message = "Conduit is shutting down."

# Conduit Ops defaults (schema 3)
[security.throttle]
enabled = true
max-attempts = 40
window-ms = 1000
max-concurrent = 32
ipv4-prefix = 32
ipv6-prefix = 64
log-interval-ms = 5000

# Conduit Ops defaults (schema 3)
[security.bot-filter]
enabled = true
strike-threshold = 10
handshake-timeout-ms = 3000
block-duration-ms = 60000
strike-window-ms = 60000

# Conduit Ops defaults (schema 3)
[security.channel-guard]
enabled = false
default-action = "log"
block-list = ["wdl:init", "wdl:control"]
log-list = ["schematica"]
kick-list = []

# Conduit Ops defaults (schema 3)
[security.attack-mode]
throttle-max-attempts = 8
bot-strike-threshold = 3

# Conduit Ops defaults (schema 3)
[modded]
enabled = true
known-packs-limit = 1024
handshake-cache = true
handshake-cache-capacity = 4096
handshake-cache-ttl-ms = 300000
forge-compat = true
neoforge-compat = true
fabric-compat = true
unknown-policy = "allow"
packet-queue-enabled = true
packet-queue-max-depth = 512
log-mod-handshakes = false

# Conduit Ops schema
[ops]
schema-version = 3

# Phase: ViaVersion as the translation engine for this pair.
[translation]
enabled = true
engine = "via-preferred"
via-backwards = true
via-rewind = true
via-legacy = false
data-folder = "via"
