[listener]
host = "127.0.0.1"
port = 25565
max-frame-bytes = 1048576

[forwarding]
mode = "none"
# secret-file = "secrets/forwarding.secret"

[authentication]
mode = "offline"
# session-url = "https://sessionserver.mojang.com/session/minecraft/hasJoined"
# timeout-millis = 5000

[servers.lobby]
host = "127.0.0.1"
port = 25566

# [servers.survival]
# host = "127.0.0.1"
# port = 25567

[routing]
initial = ["lobby"]
fallback = ["lobby"]

# Optional ViaVersion ecosystem translation (disabled by default).
# See docs/VIAVERSION.md and docs/LICENSING_VIA.md (GPLv3 Via* artifacts).
[translation]
enabled = false
engine = "via-preferred"
via-backwards = true
via-rewind = true
via-legacy = false
data-folder = "via"
