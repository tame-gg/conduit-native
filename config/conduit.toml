[listener]
host = "127.0.0.1"
port = 25565
max-frame-bytes = 1048576

[forwarding]
mode = "none"
# secret-file = "secrets/forwarding.secret"

[authentication]
mode = "offline"
# session-url = "https://sessionserver.mojang.com/session/minecraft/hasJoined"
# timeout-millis = 5000
# A login of a player who is already connected is refused. true ends the existing session instead
# and lets the new login in; in offline mode that lets anyone who types a name kick its player.
# kick-existing-players = false

[servers.lobby]
host = "127.0.0.1"
port = 25566

# [servers.survival]
# host = "127.0.0.1"
# port = 25567

[routing]
initial = ["lobby"]
fallback = ["lobby"]

# Server list entry. motd takes &-codes (&0-&9 &a-&f colours, &l &o &n &m &k decorations, &r plain) and \n
# for a second line. display-max-players is only the number shown after the slash; it limits nothing.
# favicon is a 64x64 PNG, relative to this file.
[status]
motd = "Conduit"
display-max-players = 100
# favicon = "server-icon.png"

# Optional ViaVersion ecosystem translation (disabled by default).
# See docs/VIAVERSION.md and docs/LICENSING_VIA.md (GPLv3 Via* artifacts).
[translation]
enabled = false
engine = "via-preferred"
via-backwards = true
via-rewind = true
via-legacy = false
data-folder = "via"

# Metrics in Prometheus' text format at GET /metrics. Off unless an address is set. No
# authentication: keep it on loopback or a private network. Takes effect at start.
# [metrics]
# prometheus-address = "127.0.0.1:9225"
